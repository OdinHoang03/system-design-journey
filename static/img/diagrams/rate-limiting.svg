<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Token bucket</title><desc id="d">Tokens refill into a bucket at a fixed rate; each request takes one token, and a request that finds the bucket empty is rejected with 429.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="30" width="150" height="60" rx="10" class="g"/><text x="95" y="57" text-anchor="middle">Refill</text><text x="95" y="76" text-anchor="middle" class="s">r tokens / second</text>
<path d="M230 120 L250 205 L390 205 L410 120" class="o"/><text x="320" y="232" text-anchor="middle" class="s">bucket, capacity b</text>
<circle cx="290" cy="185" r="12" class="b"/><circle cx="325" cy="185" r="12" class="b"/><circle cx="360" cy="185" r="12" class="b"/><circle cx="308" cy="155" r="12" class="b"/><circle cx="343" cy="155" r="12" class="b"/>
<path d="M170 70 L300 120" class="l" marker-end="url(#a)"/>
<rect x="500" y="20" width="180" height="60" rx="10" class="b"/><text x="590" y="47" text-anchor="middle">Token available</text><text x="590" y="66" text-anchor="middle" class="s">take 1 → 200 OK</text>
<rect x="500" y="170" width="180" height="60" rx="10" class="g"/><text x="590" y="197" text-anchor="middle">Bucket empty</text><text x="590" y="216" text-anchor="middle" class="s">429 + Retry-After</text>
<path d="M410 150 L496 62" class="l" marker-end="url(#a)"/><path d="M410 180 L496 198" class="l" marker-end="url(#a)"/>
<text x="20" y="150" class="s">request →</text>
</svg>
