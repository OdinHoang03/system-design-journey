<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Sharding by key</title><desc id="d">A router hashes the user id and sends the query to one of three shards.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="95" width="110" height="60" rx="10" class="b"/><text x="75" y="131" text-anchor="middle">App</text>
<rect x="200" y="85" width="170" height="80" rx="10" class="o"/><text x="285" y="115" text-anchor="middle">Shard router</text><text x="285" y="137" text-anchor="middle" class="s">hash(user_id) mod 3</text>
<rect x="500" y="15" width="170" height="60" rx="10" class="g"/><text x="585" y="42" text-anchor="middle">Shard 0</text><text x="585" y="62" text-anchor="middle" class="s">users A–…</text>
<rect x="500" y="100" width="170" height="60" rx="10" class="g"/><text x="585" y="127" text-anchor="middle">Shard 1</text><text x="585" y="147" text-anchor="middle" class="s">each with own replicas</text>
<rect x="500" y="185" width="170" height="60" rx="10" class="g"/><text x="585" y="212" text-anchor="middle">Shard 2</text><text x="585" y="232" text-anchor="middle" class="s">users …–Z</text>
<path d="M132 125 H196" class="l" marker-end="url(#a)"/>
<path d="M372 105 L496 55" class="l" marker-end="url(#a)"/><path d="M372 125 H496" class="l" marker-end="url(#a)"/><path d="M372 145 L496 205" class="l" marker-end="url(#a)"/>
</svg>
