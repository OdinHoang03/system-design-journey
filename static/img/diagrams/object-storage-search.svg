<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-labelledby="t d"><title id="t">Object storage and inverted index</title><desc id="d">Files go to object storage through a presigned URL; the metadata database references them; a search index maps each word to the notes that contain it.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="15" y="20" width="110" height="50" rx="10" class="b"/><text x="70" y="50" text-anchor="middle">Client</text>
<rect x="250" y="20" width="130" height="50" rx="10" class="b"/><text x="315" y="50" text-anchor="middle">API</text>
<rect x="540" y="20" width="145" height="50" rx="10" class="o"/><text x="612" y="43" text-anchor="middle">Object storage</text><text x="612" y="60" text-anchor="middle" class="s">bucket / key</text>
<path d="M127 35 H248" class="l" marker-end="url(#a)"/><text x="145" y="28" class="s">1 ask</text>
<path d="M248 56 H127" class="d" marker-end="url(#a)"/><text x="130" y="72" class="s">2 presigned URL</text>
<path d="M70 72 C70 110 400 110 600 74" class="l" marker-end="url(#a)"/><text x="330" y="118" class="s">3 upload directly</text>
<rect x="250" y="150" width="130" height="50" rx="10" class="g"/><text x="315" y="172" text-anchor="middle">Metadata DB</text><text x="315" y="190" text-anchor="middle" class="s">note → object key</text>
<path d="M315 72 V148" class="l" marker-end="url(#a)"/>
<rect x="470" y="140" width="215" height="125" rx="10" class="g"/><text x="577" y="164" text-anchor="middle">Inverted index</text>
<text x="485" y="188" class="s">cache  → [3, 17, 42]</text><text x="485" y="208" class="s">shard  → [17, 99]</text><text x="485" y="228" class="s">queue  → [3, 42, 99]</text><text x="485" y="252" class="s">"cache AND queue" → [3, 42]</text>
<path d="M382 175 H468" class="d" marker-end="url(#a)"/><text x="385" y="168" class="s">index</text>
</svg>
