<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-labelledby="t d"><title id="t">Message queue</title><desc id="d">A web server enqueues jobs and answers immediately; workers consume jobs at their own pace.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="85" width="120" height="60" rx="10" class="b"/><text x="80" y="121" text-anchor="middle">API</text>
<rect x="230" y="90" width="230" height="50" rx="10" class="o"/><text x="345" y="112" text-anchor="middle">Queue</text><text x="345" y="130" text-anchor="middle" class="s">job · job · job · job</text>
