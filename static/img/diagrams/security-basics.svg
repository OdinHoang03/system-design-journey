<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-labelledby="t d"><title id="t">Security layers</title><desc id="d">A request passes through TLS, a gateway with rate limiting and authentication, an authorization check, and finally reaches data protected by least privilege.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="10" y="85" width="100" height="60" rx="10" class="g"/><text x="60" y="121" text-anchor="middle">Client</text>
<rect x="150" y="60" width="110" height="110" rx="10" class="o"/><text x="205" y="105" text-anchor="middle">TLS</text><text x="205" y="125" text-anchor="middle" class="s">encrypt</text>
<rect x="300" y="60" width="120" height="110" rx="10" class="o"/><text x="360" y="98" text-anchor="middle">Gateway</text><text x="360" y="118" text-anchor="middle" class="s">authn</text><text x="360" y="136" text-anchor="middle" class="s">rate limit</text>
<rect x="460" y="60" width="110" height="110" rx="10" class="o"/><text x="515" y="98" text-anchor="middle">Service</text><text x="515" y="118" text-anchor="middle" class="s">authz per</text><text x="515" y="136" text-anchor="middle" class="s">object</text>
<rect x="600" y="85" width="90" height="60" rx="10" class="b"/><text x="645" y="112" text-anchor="middle">Data</text><text x="645" y="130" text-anchor="middle" class="s">least priv.</text>
<path d="M112 115 H146" class="l" marker-end="url(#a)"/><path d="M262 115 H296" class="l" marker-end="url(#a)"/><path d="M422 115 H456" class="l" marker-end="url(#a)"/><path d="M572 115 H596" class="l" marker-end="url(#a)"/>
<text x="350" y="210" text-anchor="middle" class="s">defense in depth: each layer assumes the one before it can fail</text>
</svg>
