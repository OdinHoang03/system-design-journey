<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">CDN edge cache</title><desc id="d">Users reach a nearby edge server; on a miss the edge fetches from the origin and keeps a copy.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="30" width="110" height="50" rx="10" class="b"/><text x="75" y="60" text-anchor="middle">User (HCMC)</text>
<rect x="20" y="170" width="110" height="50" rx="10" class="b"/><text x="75" y="200" text-anchor="middle">User (Berlin)</text>
<rect x="260" y="30" width="150" height="50" rx="10" class="o"/><text x="335" y="52" text-anchor="middle">Edge Singapore</text><text x="335" y="70" text-anchor="middle" class="s">HIT: serve copy</text>
<rect x="260" y="170" width="150" height="50" rx="10" class="o"/><text x="335" y="192" text-anchor="middle">Edge Frankfurt</text><text x="335" y="210" text-anchor="middle" class="s">MISS: fetch + store</text>
<rect x="540" y="100" width="140" height="60" rx="10" class="g"/><text x="610" y="127" text-anchor="middle">Origin</text><text x="610" y="147" text-anchor="middle" class="s">your server</text>
<path d="M132 55 H256" class="l" marker-end="url(#a)"/><path d="M132 195 H256" class="l" marker-end="url(#a)"/>
<path d="M412 195 L538 150" class="l" marker-end="url(#a)"/><path d="M412 55 L538 110" class="d" marker-end="url(#a)"/>
