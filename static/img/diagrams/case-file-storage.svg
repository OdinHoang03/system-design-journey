<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="t d"><title id="t">File and video storage</title><desc id="d">A client splits a file into chunks and uploads them directly to object storage using pre-signed URLs; a metadata service tracks files and chunks; finished videos go to a queue for transcoding and are served through a CDN.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="10" y="100" width="110" height="60" rx="10" class="b"/><text x="65" y="127" text-anchor="middle">Client</text><text x="65" y="146" text-anchor="middle" class="s">split into chunks</text>
<rect x="230" y="20" width="150" height="60" rx="10" class="o"/><text x="305" y="47" text-anchor="middle">Metadata service</text><text x="305" y="66" text-anchor="middle" class="s">files, chunks, versions</text>
<rect x="230" y="180" width="150" height="70" rx="10" class="g"/><text x="305" y="208" text-anchor="middle">Object storage</text><text x="305" y="227" text-anchor="middle" class="s">chunks, replicated</text>
<rect x="470" y="180" width="120" height="70" rx="10" class="o"/><text x="530" y="208" text-anchor="middle">Queue</text><text x="530" y="227" text-anchor="middle" class="s">+ transcoders</text>
<rect x="630" y="100" width="110" height="60" rx="10" class="g"/><text x="685" y="127" text-anchor="middle">CDN</text><text x="685" y="146" text-anchor="middle" class="s">video segments</text>
<path d="M118 115 L226 62" class="l" marker-end="url(#a)"/><text x="100" y="75" class="s">1 start upload</text>
<path d="M118 150 L226 205" class="l" marker-end="url(#a)"/><text x="105" y="205" class="s">2 PUT chunks</text>
<path d="M305 182 L305 84" class="d" marker-end="url(#a)"/><text x="315" y="135" class="s">3 commit</text>
<path d="M382 215 L466 215" class="l" marker-end="url(#a)"/><text x="385" y="205" class="s">4 job</text>
<path d="M590 195 L670 164" class="l" marker-end="url(#a)"/><text x="620" y="205" class="s">5 publish</text>
</svg>
