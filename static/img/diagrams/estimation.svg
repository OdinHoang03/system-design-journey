<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t d"><title id="t">Back-of-the-envelope estimation chain</title><desc id="d">From daily active users to requests per day, average QPS, peak QPS, and storage per year.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="10" y="60" width="130" height="70" rx="10" class="b"/><text x="75" y="92" text-anchor="middle">DAU</text><text x="75" y="113" text-anchor="middle" class="s">1M users</text>
<rect x="170" y="60" width="130" height="70" rx="10" class="b"/><text x="235" y="92" text-anchor="middle">Requests/day</text><text x="235" y="113" text-anchor="middle" class="s">DAU × actions</text>
<rect x="330" y="60" width="130" height="70" rx="10" class="o"/><text x="395" y="92" text-anchor="middle">Average QPS</text><text x="395" y="113" text-anchor="middle" class="s">÷ 86,400 s</text>
<rect x="490" y="60" width="120" height="70" rx="10" class="o"/><text x="550" y="92" text-anchor="middle">Peak QPS</text><text x="550" y="113" text-anchor="middle" class="s">× 2–10</text>
<rect x="640" y="60" width="110" height="70" rx="10" class="g"/><text x="695" y="92" text-anchor="middle">Storage</text><text x="695" y="113" text-anchor="middle" class="s">× size × days</text>
<path d="M142 95 L166 95" class="l" marker-end="url(#a)"/><path d="M302 95 L326 95" class="l" marker-end="url(#a)"/><path d="M462 95 L486 95" class="l" marker-end="url(#a)"/><path d="M612 95 L636 95" class="l" marker-end="url(#a)"/>
</svg>
