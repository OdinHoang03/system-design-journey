<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Event streaming</title><desc id="d">A producer appends events to partitions of a log; two consumer groups read the same log independently, each tracking its own offset.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="95" width="110" height="60" rx="10" class="b"/><text x="75" y="131" text-anchor="middle">Producer</text>
<rect x="210" y="40" width="250" height="50" rx="10" class="o"/><text x="335" y="60" text-anchor="middle">Partition 0</text><text x="335" y="78" text-anchor="middle" class="s">0 · 1 · 2 · 3 · 4 →</text>
<rect x="210" y="105" width="250" height="50" rx="10" class="o"/><text x="335" y="125" text-anchor="middle">Partition 1</text><text x="335" y="143" text-anchor="middle" class="s">0 · 1 · 2 · 3 →</text>
<rect x="210" y="170" width="250" height="50" rx="10" class="o"/><text x="335" y="190" text-anchor="middle">Partition 2</text><text x="335" y="208" text-anchor="middle" class="s">0 · 1 · 2 · 3 · 4 · 5 →</text>
<rect x="550" y="55" width="130" height="60" rx="10" class="b"/><text x="615" y="82" text-anchor="middle">Group: search</text><text x="615" y="100" text-anchor="middle" class="s">offset riêng</text>
<rect x="550" y="150" width="130" height="60" rx="10" class="g"/><text x="615" y="177" text-anchor="middle">Group: stats</text><text x="615" y="195" text-anchor="middle" class="s">offset riêng</text>
