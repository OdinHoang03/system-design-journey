<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Four data models</title><desc id="d">The same note stored as relational rows, a JSON document, a key-value pair and a wide-column row.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="15" y="20" width="155" height="215" rx="10" class="b"/><text x="92" y="48" text-anchor="middle">Relational</text><text x="92" y="82" text-anchor="middle" class="s">notes(id, user_id,</text><text x="92" y="102" text-anchor="middle" class="s">title, body)</text><text x="92" y="132" text-anchor="middle" class="s">tags(note_id, tag)</text><text x="92" y="170" text-anchor="middle" class="s">JOIN + transaction</text><text x="92" y="210" text-anchor="middle" class="s">PostgreSQL, MySQL</text>
<rect x="185" y="20" width="155" height="215" rx="10" class="o"/><text x="262" y="48" text-anchor="middle">Document</text><text x="262" y="82" text-anchor="middle" class="s">{ _id, title,</text><text x="262" y="102" text-anchor="middle" class="s">tags: [...],</text><text x="262" y="122" text-anchor="middle" class="s">body }</text><text x="262" y="170" text-anchor="middle" class="s">one read = one note</text><text x="262" y="210" text-anchor="middle" class="s">MongoDB, Firestore</text>
<rect x="355" y="20" width="155" height="215" rx="10" class="g"/><text x="432" y="48" text-anchor="middle">Key-value</text><text x="432" y="92" text-anchor="middle" class="s">note:42 → blob</text><text x="432" y="130" text-anchor="middle" class="s">get / put / delete</text><text x="432" y="170" text-anchor="middle" class="s">no query by value</text><text x="432" y="210" text-anchor="middle" class="s">Redis, DynamoDB</text>
<rect x="525" y="20" width="160" height="215" rx="10" class="g"/><text x="605" y="48" text-anchor="middle">Wide-column</text><text x="605" y="82" text-anchor="middle" class="s">row key = user_id</text><text x="605" y="102" text-anchor="middle" class="s">cols sorted by time</text><text x="605" y="140" text-anchor="middle" class="s">huge write volume</text><text x="605" y="170" text-anchor="middle" class="s">query by key only</text><text x="605" y="210" text-anchor="middle" class="s">Cassandra, HBase</text>
</svg>
