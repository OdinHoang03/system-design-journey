<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Cache-aside</title><desc id="d">The app checks the cache first; on a miss it reads the database and writes the result into the cache.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="95" width="120" height="60" rx="10" class="b"/><text x="80" y="131" text-anchor="middle">App</text>
<rect x="290" y="20" width="150" height="60" rx="10" class="o"/><text x="365" y="47" text-anchor="middle">Cache</text><text x="365" y="66" text-anchor="middle" class="s">Redis / memory</text>
<rect x="290" y="180" width="150" height="60" rx="10" class="g"/><text x="365" y="217" text-anchor="middle">Database</text>
<path d="M130 100 L286 62" class="l" marker-end="url(#a)"/><text x="190" y="68" class="s">1 get(key)</text>
<path d="M286 72 L140 112" class="d" marker-end="url(#a)"/><text x="215" y="108" class="s">hit: value</text>
<path d="M130 150 L286 200" class="l" marker-end="url(#a)"/><text x="170" y="196" class="s">2 miss: read</text>
<path d="M440 195 C 520 150 520 90 444 66" class="l" marker-end="url(#a)"/><text x="520" y="130" class="s">3 set(key, TTL)</text>
</svg>
