<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Saga with compensation</title><desc id="d">An order saga runs three local transactions in sequence: create order, charge payment, reserve stock. If reserving stock fails, compensating steps refund the payment and cancel the order.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.r{fill:#fdecea;stroke:#b3261e;stroke-width:2.5}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#b3261e;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="20" y="40" width="170" height="60" rx="10" class="b"/><text x="105" y="66" text-anchor="middle">1. Order</text><text x="105" y="85" text-anchor="middle" class="s">create PENDING</text>
<rect x="265" y="40" width="170" height="60" rx="10" class="b"/><text x="350" y="66" text-anchor="middle">2. Payment</text><text x="350" y="85" text-anchor="middle" class="s">charge card</text>
<rect x="510" y="40" width="170" height="60" rx="10" class="r"/><text x="595" y="66" text-anchor="middle">3. Stock</text><text x="595" y="85" text-anchor="middle" class="s">reserve → FAILS</text>
<path d="M192 70 H261" class="l" marker-end="url(#a)"/><path d="M437 70 H506" class="l" marker-end="url(#a)"/>
<rect x="265" y="170" width="170" height="60" rx="10" class="o"/><text x="350" y="196" text-anchor="middle">Refund</text><text x="350" y="215" text-anchor="middle" class="s">compensate 2</text>
<rect x="20" y="170" width="170" height="60" rx="10" class="o"/><text x="105" y="196" text-anchor="middle">Cancel order</text><text x="105" y="215" text-anchor="middle" class="s">compensate 1</text>
<path d="M595 102 C 595 150 480 200 439 200" class="d" marker-end="url(#e)"/><path d="M261 200 H194" class="d" marker-end="url(#e)"/>
</svg>
