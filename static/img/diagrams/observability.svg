<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d"><title id="t">Observability</title><desc id="d">A service emits logs, metrics and traces; an alert fires on a symptom and the engineer drills from metric to trace to log.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}.d{stroke:#555;stroke-width:2.2;fill:none;stroke-dasharray:6 5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="100" width="130" height="60" rx="10" class="b"/><text x="85" y="136" text-anchor="middle">Service</text>
<rect x="260" y="20" width="160" height="50" rx="10" class="o"/><text x="340" y="42" text-anchor="middle">Metrics</text><text x="340" y="60" text-anchor="middle" class="s">what is wrong</text>
<rect x="260" y="105" width="160" height="50" rx="10" class="o"/><text x="340" y="127" text-anchor="middle">Traces</text><text x="340" y="145" text-anchor="middle" class="s">where it is slow</text>
<rect x="260" y="190" width="160" height="50" rx="10" class="o"/><text x="340" y="212" text-anchor="middle">Logs</text><text x="340" y="230" text-anchor="middle" class="s">why it happened</text>
<rect x="540" y="20" width="140" height="50" rx="10" class="g"/><text x="610" y="42" text-anchor="middle">SLO alert</text><text x="610" y="60" text-anchor="middle" class="s">symptom</text>
<rect x="540" y="105" width="140" height="50" rx="10" class="b"/><text x="610" y="135" text-anchor="middle">On-call</text>
<path d="M152 118 L256 50" class="l" marker-end="url(#a)"/><path d="M152 130 H256" class="l" marker-end="url(#a)"/><path d="M152 142 L256 212" class="l" marker-end="url(#a)"/>
