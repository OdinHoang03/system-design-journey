<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="t d"><title id="t">Notification system</title><desc id="d">Services call a notification API; it checks preferences and de-duplicates, then puts messages on per-channel queues; workers send through push, email and SMS providers.</desc><style>text{font:600 16px sans-serif;fill:#1b1b1b}.s{font:400 13px sans-serif;fill:#444}.b{fill:#e8f5ee;stroke:#1f6b45;stroke-width:2.5}.g{fill:#f3f3f3;stroke:#777;stroke-width:2}.o{fill:#fff3e0;stroke:#c77700;stroke-width:2.5}.l{stroke:#555;stroke-width:2.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="10" y="100" width="110" height="60" rx="10" class="g"/><text x="65" y="136" text-anchor="middle">Services</text>
<rect x="160" y="80" width="150" height="100" rx="10" class="o"/><text x="235" y="110" text-anchor="middle">Notification API</text><text x="235" y="134" text-anchor="middle" class="s">preferences</text><text x="235" y="154" text-anchor="middle" class="s">de-dup · rate limit</text>
<rect x="350" y="20" width="110" height="50" rx="10" class="b"/><text x="405" y="51" text-anchor="middle">Push queue</text>
<rect x="350" y="115" width="110" height="50" rx="10" class="b"/><text x="405" y="146" text-anchor="middle">Email queue</text>
<rect x="350" y="210" width="110" height="50" rx="10" class="b"/><text x="405" y="241" text-anchor="middle">SMS queue</text>
<rect x="500" y="20" width="100" height="50" rx="10" class="g"/><text x="550" y="51" text-anchor="middle">Workers</text>
<rect x="500" y="115" width="100" height="50" rx="10" class="g"/><text x="550" y="146" text-anchor="middle">Workers</text>
<rect x="500" y="210" width="100" height="50" rx="10" class="g"/><text x="550" y="241" text-anchor="middle">Workers</text>
<rect x="640" y="20" width="130" height="50" rx="10" class="o"/><text x="705" y="51" text-anchor="middle">APNs / FCM</text>
<rect x="640" y="115" width="130" height="50" rx="10" class="o"/><text x="705" y="146" text-anchor="middle">Email provider</text>
<rect x="640" y="210" width="130" height="50" rx="10" class="o"/><text x="705" y="241" text-anchor="middle">SMS provider</text>
